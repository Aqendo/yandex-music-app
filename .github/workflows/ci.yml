name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-x86_64-unknown-linux-gnu
          path: |
            target/release/yandex-music
            target/release/ym-cli
            target/release/playtest
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    name: build (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-aarch64-unknown-linux-gnu
          path: |
            target/release/yandex-music
            target/release/ym-cli
            target/release/playtest
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: brew install gtk4 libadwaita gstreamer adwaita-icon-theme

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package .dmg
        run: bash packaging/macos-dmg.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: build-aarch64-apple-darwin
          path: |
            target/release/yandex-music
            target/release/ym-cli
            target/release/playtest
          if-no-files-found: error
          retention-days: 7

      - name: Upload .dmg
        uses: actions/upload-artifact@v5
        with:
          name: build-aarch64-apple-darwin-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
