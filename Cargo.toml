[package]
name = "yandex-music-app"
version = "0.1.0"
edition = "2021"
description = "Unofficial native GTK4 player for Yandex Music"
license = "MIT"

[package.metadata.deb]
maintainer = "Aqendo"
section = "sound"
priority = "optional"
depends = "libgtk-4-1, libadwaita-1-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, gstreamer1.0-pulseaudio"

[lib]
name = "ymapp"
path = "src/lib.rs"

[[bin]]
name = "yandex-music"
path = "src/main.rs"

[[bin]]
name = "ym-cli"
path = "src/bin/cli.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
gstreamer = "0.23"
gstreamer-play = "0.23"
gstreamer-audio = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
quick-xml = "0.37"
directories = "5"
thiserror = "2"
rand = "0.8"
mpris-server = "0.9"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = true
strip = true
